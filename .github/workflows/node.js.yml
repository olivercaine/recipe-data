# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 18 1 * *' # 1st of every month    
  workflow_dispatch: # Enables running workflow manually

jobs:
  build:
    name: Build and test package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [ 18, 20 ] # Latest LTS and current Node.js versions
    steps:
    - uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        cache: 'npm'
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run health-check
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.run_id }} # Unique artifact name
        path: dist
        retention-days: 7

  package:
    needs: [build]
    name: Prepare package
    runs-on: ubuntu-latest
    steps:
    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ github.run_id }} # Match unique artifact name
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Latest LTS
        cache: 'npm'
    - name: Pre-release
      run: |
        npm version prerelease --preid=$GITHUB_RUN_ID --no-git-tag-version
        npm pack
        ls
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ github.run_id }} # Unique artifact name
        path: "./*.tgz"
        retention-days: 7

  publish:
    needs: [package]
    name: Publish to GitHub Package Registry
    runs-on: ubuntu-latest
    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: package-${{ github.run_id }} # Match unique artifact name
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Latest LTS
        registry-url: https://npm.pkg.github.com/
        scope: "@olivercaine"
    - run: echo "registry=https://npm.pkg.github.com/@olivercaine" >> .npmrc
    - run: npm publish $(ls *.tgz)
      env:
        NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}